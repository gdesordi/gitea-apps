name: Release VS Code extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Validate tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${RELEASE_TAG#v}
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npm run package -- --out "gitea-vscode-extension-${{ github.ref_name }}.vsix"

      - name: Create GitHub release and attach VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "gitea-vscode-extension-${RELEASE_TAG}.vsix" --generate-notes
